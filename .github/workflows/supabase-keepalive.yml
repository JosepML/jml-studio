name: Mantener Supabase activo

on:
  schedule:
    # Cuatro consultas diarias, separadas y de solo lectura.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase sin modificar datos
        env:
          SUPABASE_URL: https://jgolxrpxyuxpqqdyikwb.supabase.co
          # La anon key no es secreta: es la misma clave pública que usa la PWA
          # en js/config.js. Nunca usar aquí la service_role key.
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impnb2x4cnB4eXV4cHFxZHlpa3diIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NDkwNjgsImV4cCI6MjEwMDIyNTA2OH0.10eguHMo8GYuUAAGX5bbziAbquypvtdxF9Q8Ks1QmPA
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            "$SUPABASE_URL/rest/v1/proyectos?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")"
          echo "Supabase respondió con HTTP $status"
          # Incluso una respuesta 401/403 confirma que el proyecto está
          # despierto; la consulta nunca escribe datos ni necesita service_role.
          if [[ "$status" =~ ^5 ]]; then
            echo "Supabase ha respondido con un error temporal del servidor."
            exit 1
          fi
